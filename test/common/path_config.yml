# Common root paths. Each entity name can be replaced in task configuration file
# Root path is specified when running the ezreg python
# For example: 
#   python3 run_ezreg_test.py --root_dir /home/xtang
# The value of the benchmark_root will be 
#   /home/xtang/etc/benchmarks
# When user can use the variable in task configuration like
#   var_name: "[BENCHMARK_ROOT]/and2/and2.v"
# The value of the var_name will be
#   /home/xtang/etc/benchmarks/and2/and2.v
benchmark_root: "[ROOT_PATH]/etc/benchmarks"
template_root: "[ROOT_PATH]/test/tmpl"
task_root: "[ROOT_PATH]/test/tasks"
boot_config: "[ROOT_PATH]/etc/boot_config/build.xml"
req_root: "[ROOT_PATH]/test/requirements"
