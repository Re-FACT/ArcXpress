  frozen_device_regtest:
    needs: change_detect
    if: ${{ fromJSON(needs.change_detect.outputs.source_modified) }}
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Golden Netlist Regression Tests (GCC-10, CentOS 7)"
            cc: gcc
            cxx: g++
            os: [self-hosted, Linux, X64, eda_us]
            installer_type: "STGZ"
            dut_device: "frozen_device_support"
    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}
    steps:
      - name: Runner workspace path
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"
          
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.CI4RF }}
          persist-credentials: false

      - name: Dump tool versions
        run: |
          cmake --version
          ${CC} --version
          ${CXX} --version

      - name: Checkout submodules
        shell: bash
        run: |
          make checkout_all

      - name: Build
        shell: bash
        run: |
          make compile INSTALL_FULL_DEVICE=ON BUILD_WITH_GRAPHVIZ=OFF -j8

      - name: Regression test
        shell: bash
        run: |
          make reg_test REG_TEST_TYPE=${{ matrix.config.dut_device }} NUM_JOBS=8 REG_TEST_NEW_THREAD_WAIT_TIME=10
      
      - name: Checkout PilotOne golden netlist
        uses: actions/checkout@v4
        with:
          repository: RapidFlex/PilotOne
          token: ${{ secrets.CI4RF }}
          path: pilotone_repo
          fetch-depth: 1
          ref: main

      - name: Find absolute path for netlist/rtl/ultimate
        run: |
          # Find the directory containing netlist/rtl/ultimate and output its absolute path
          NETLIST_PATH=$(find $GITHUB_WORKSPACE -type d -path "*/netlist/rtl/ultimate" | head -n 1)
          echo "Found NETLIST_PATH: $NETLIST_PATH"
          echo "NETLIST_PATH=$NETLIST_PATH" >> $GITHUB_ENV

      - name: Compare netlist with golden netlist
        shell: bash
        run: |
          echo "NETLIST_PATH is: ${{ env.NETLIST_PATH }}"

          # Check if the NETLIST_PATH exists
          if [ ! -d "${{ env.NETLIST_PATH }}" ]; then
            echo "ERROR: Netlist directory not found at: ${{ env.NETLIST_PATH }}"
            exit 1
          fi

          # Ensure golden_netlist_dir exists
          if [ ! -d "${{ github.workspace }}/golden_netlist_dir" ]; then
            mkdir -p "${{ github.workspace }}/golden_netlist_dir"
          fi

          # Directly copy checksums.txt instead of fabric_netlist
          echo "Copying checksums.txt..."
          cp ${{ github.workspace }}/pilotone_repo/rtl_golden/checksums.txt ${{ github.workspace }}/golden_netlist_dir/

          # Ensure the file system is synchronized and all files are written
          sync

          # Optionally, wait for a few seconds to make sure file writes are completed
          sleep 2
          echo "Golden netlist prepared at: ${{ github.workspace }}/golden_netlist_dir"

          # Step 1: Create a checksum file for the netlist directory (including symlinks)
          echo "Generating checksum for the netlist directory (including symlinks)..."
          find -L ${{ env.NETLIST_PATH }} -type f -exec sha256sum {} \; | awk '{print $1}' | sort > netlist_checksums.txt

          # Check if the checksum file is created
          if [ ! -s netlist_checksums.txt ]; then
            echo "ERROR: No checksums were generated for the netlist files."
            exit 1
          fi

          # Step 2: Sort both checksums files before comparison
          echo "Sorting checksums files..."
          awk '{print $1}' ${{ github.workspace }}/golden_netlist_dir/checksums.txt | sort > checksums_sorted.txt
          sort netlist_checksums.txt -o netlist_checksums_sorted.txt

          # Step 3: Compare the sorted checksum files
          echo "Comparing sorted checksums..."
          if diff -q checksums_sorted.txt netlist_checksums_sorted.txt >/dev/null 2>&1; then
            echo "SUCCESS: Checksums match."
          else
            echo "ERROR: Checksums do not match!"
            exit 1
          fi
              
  strong_regtest:
    needs: [basic_regtest, frozen_device_regtest]  # Updated to run after basic and frozen device tests
    if: ${{ fromJSON(needs.change_detect.outputs.source_modified) }}
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    # Strong tests require intensive computing time. Set to 12 hours
    timeout-minutes: 720
    # Note: dependencies are installed in the container. See details about dependency list in docker/Dockerfile.master
    # Comment the line out when base image is built again
    #container: ghcr.io/${{ needs.change_detect.outputs.docker_repo }}/openfpga-build-${{ matrix.config.cc}}
    # Branch on different OS and settings
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "AlkaidL Strong Regression Tests (GCC-10, CentOS 7)"
            cc: gcc
            cxx: g++
            os: [self-hosted, Linux, X64, eda_cn]
            installer_type: "STGZ"
            dut_device: "strong_alkaidL"
          - name: "AlkaidC Strong Regression Tests (GCC-10, CentOS 7)"
            cc: gcc
            cxx: g++
            os: [self-hosted, Linux, X64, eda_cn]
            installer_type: "STGZ"
            dut_device: "strong_alkaidC"
          - name: "AlkaidD Strong Regression Tests (GCC-10, CentOS 7)"
            cc: gcc
            cxx: g++
            os: [self-hosted, Linux, X64, eda_cn]
            installer_type: "STGZ"
            dut_device: "strong_alkaidD"
    # Define the steps to run the build job
    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}
    steps:
      - name: Runner workspace path
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"
          
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Dump tool versions
        run: |
          cat /etc/centos-release
          cmake --version
          ${CC} --version
          ${CXX} --version

      - name: Checkout submodules
        shell: bash
        run: |
          make checkout_all

      - name: Build
        shell: bash
        run: |
          echo "conda activate eda && make compile INSTALL_FULL_DEVICE=ON BUILD_WITH_GRAPHVIZ=ON -j8" > scl_compile.sh
          cat scl_compile.sh | scl enable devtoolset-10 csh

      - name: Regression test
        shell: bash
        run: |
          echo "conda activate eda && make reg_test REG_TEST_TYPE=${{ matrix.config.dut_device }} NUM_JOBS=8 REG_TEST_NEW_THREAD_WAIT_TIME=10" > scl_regtest_strong.sh
          cat scl_regtest_strong.sh | scl enable devtoolset-10 csh

  basic_regtest_minimal_device:
    needs: change_detect
    if: ${{ fromJSON(needs.change_detect.outputs.source_modified) }}
    name: "Basic Regression Tests (Minimal Device: alkaidL only, INSTALL_FULL_DEVICE=OFF)"
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Basic Regression Tests (Minimal Device: alkaidL only, INSTALL_FULL_DEVICE=OFF)"
            cc: gcc-11
            cxx: g++-11
            os: [self-hosted, Linux, X64, eda_us]
            installer_type: "STGZ"
    env:
      CC: ${{ matrix.config.cc }}
      CXX: ${{ matrix.config.cxx }}
    steps:
      - name: Runner workspace path
        run: |
          echo "Cleaning up previous run"
          rm -rf "${{ github.workspace }}"
          mkdir -p "${{ github.workspace }}"
          
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.CI4RF }}
          persist-credentials: false

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: RapidFlex/arkangel_frontend
          submodules: recursive
          token: ${{ secrets.CI4RF }}
          path: ${{github.workspace}}/libs/arkangel_frontend

      - name: Checkout Spydrnet
        uses: actions/checkout@v4
        with:
          repository: RapidFlex/rf_spydrnet
          submodules: recursive
          token: ${{ secrets.CI4RF }}
          path: ${{github.workspace}}/etc/utils/rf_spydrnet

      - name: Dump tool versions
        run: |
          cmake --version
          ${CC} --version
          ${CXX} --version

      - name: Build
        shell: bash
        env:
          py_cv_module__tkinter: "disabled"
        run: |
          make checkout_all
          make compile INSTALL_FULL_DEVICE=OFF

      - name: Regression test (alkaidL only)
        shell: bash
        run: |
          make reg_test REG_TEST_TYPE=basic_alkaidL_only INSTALL_FULL_DEVICE=OFF REG_TEST_NEW_THREAD_WAIT_TIME=10
          
      - name: upload result
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: minimal-device-artifact
          path: ${{github.workspace}}/test/tasks

